# tmux.conf — configuration for long-running, reattachable sessions.
# Lives in the dotfiles repo; symlinked to ~/.tmux.conf by install.sh.
# With tmux, your "first mate" session survives terminal close and can be
# reattached from any machine:  tmux attach

# --- Prefix ---------------------------------------------------------------
# Ctrl+b is awkward; use Ctrl+a (also means C-a no longer sends the literal
# char, but that's rarely needed in a session running an interactive agent).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded"

# --- Splits / windows ------------------------------------------------------
bind | split-window -h
bind - split-window -v
bind c new-window
bind x kill-pane

# Vim-style pane navigation with Ctrl+arrows. Press prefix first.
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# --- Nice extras ------------------------------------------------------------
set -g mouse on
set -g history-limit 10000
set -g base-index 1        # number windows/panes from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar: keep it minimal ----------------------------------------
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e] #S #[default] "
set -g status-right "#(whoami)@#h #[fg=#f38ba8]#[default]"

# --- Persistent: auto-rename + don't die on detach ---------------------
set -g monitor-activity on
set -g automatic-rename on

# --- OpenCode tip: start the agent in a fresh window, keep shell to it -----
# Assign opencode to a dedicated window so your main shell / sessions are
# always reattachable without losing the agent:
#   tmux new -s cmd -n agent 'opencode'