# tmux.conf — configuration for long-running, reattachable sessions.
# Lives in the dotfiles repo; symlinked to ~/.tmux.conf by install.sh.
# With tmux, your "first mate" session survives terminal close and can be
# reattached from any machine:  tmux attach

# --- Prefix ---------------------------------------------------------------
# Ctrl+b is awkward; use Ctrl+a (also means C-a no longer sends the literal
# char, but that's rarely needed in a session running an interactive agent).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- WIDE-GLYPH (Nerd Font) overlap fix ------------------------------------
# tmux double-counts the width of wide glyphs unless it speaks a UTF-8
# terminal. Telling tmux it's *inside* a 256-color UTF-8 terminal prevents the
# duplicated/overlapping prompt you get from Starship symbols in tmux.
set -g default-terminal "tmux-256color"
# UTF-8 is always on in modern tmux (>= 2.1); there is no `utf8` option.
set -sa terminal-overrides ',xterm*:smcup@:rmcup@'

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded"

# --- Splits / windows ------------------------------------------------------
bind | split-window -h
bind - split-window -v
bind c new-window
bind x kill-pane

# Vim-style pane navigation with Ctrl+arrows. Press prefix first.
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# --- Nice extras ------------------------------------------------------------
set -g mouse on

# --- Copy to the OS clipboard (the one thing that MUST just work) -----------
# Selecting text in tmux runs a "copy-pipe" command. Historically this piped
# through OSC-52 (set-clipboard on), which silently fails on several terminals
# (it dies between tmux and WezTerm on this machine). Instead, pipe the
# selection STRAIGHT to the OS clipboard:
#   WSL/Windows -> clip.exe writes directly to the Windows clipboard (no X, no
#                  OSC-52, nothing in between to drop it).
#   macOS       -> pbcopy.
#   Linux       -> xclip / xsel.
# If none of those exist we fall back to tmux's own OSC-52 (set-clipboard on).
set -g @clip-cmd "cat >/dev/null"   # safe no-op default (never errors)
if-shell 'command -v clip.exe >/dev/null 2>&1' 'set -g @clip-cmd "clip.exe"'
if-shell 'command -v pbcopy  >/dev/null 2>&1' 'set -g @clip-cmd "pbcopy"'
if-shell 'command -v xclip   >/dev/null 2>&1' 'set -g @clip-cmd "xclip -selection clipboard -i"'
if-shell 'command -v xsel    >/dev/null 2>&1' 'set -g @clip-cmd "xsel --clipboard --input"'

# Mouse drag end -> copy to clipboard AND cancel copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
# Double/triple-click word/line select -> copy straight to clipboard too.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
# Keyboard yank (y in copy mode, prefix+[ then v/space to select) -> clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    y send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
# Enter / M-w (emacs-style yank) also go to the clipboard.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode-vi C-j  send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    C-w  send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"
bind -T copy-mode    M-w  send-keys -X copy-pipe-and-cancel "#{@clip-cmd}"

# Belt & suspenders: also forward via OSC-52 where the terminal supports it
# (opencode/nvim write their own OSC-52; this only covers tmux-initiated copies).
set -g set-clipboard on
# tmux 3.3+ blocks DCS passthrough by default, which silently kills opencode's
# and nvim's own OSC-52 copies. Re-enable it (no-op on older tmux).
if-shell 'tmux -V | grep -qE "3\.[3-9]|[4-9]\.|1[0-9]\."' 'set -g allow-passthrough on'

# Toggle mouse mode on/off: prefix + m. With mouse off you can select with the
# terminal's own mouse (no tmux in the way) whenever that's more convenient.
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
set -g history-limit 10000
set -g base-index 1        # number windows/panes from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar: keep it minimal ----------------------------------------
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e] #S #[default] "
set -g status-right "#(whoami)@#h #[fg=#f38ba8]#[default]"

# --- Persistent: auto-rename + don't die on detach ---------------------
set -g monitor-activity on
set -g automatic-rename on

# --- OpenCode tip: start the agent in a fresh window, keep shell to it -----
# Assign opencode to a dedicated window so your main shell / sessions are
# always reattachable without losing the agent:
#   tmux new -s cmd -n agent 'opencode'