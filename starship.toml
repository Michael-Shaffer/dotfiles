[username]
show_always = false
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
format = "@[$hostname]($style) "

# Keep the prompt from getting noisy.
[fill]
symbol = " "

[status]
disabled = false
symbol = " "

[time]
disabled = true

