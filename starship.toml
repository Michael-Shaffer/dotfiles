# Starship prompt configuration
# Shared across bash, zsh, fish on every OS. Lives in the dotfiles repo,
# symlinked to ~/.config/starship.toml
#
# Kanagawa colours (set in wezterm.lua) with Nerd Font symbols. Every style
# below is an ANSI colour NAME, so the prompt follows the terminal palette.
# Additional Nerd Font symbols (nerd-font-symbols preset) appended below.

# Top-level format lives BEFORE every section so it applies to the whole prompt.
# No $fill before $status. $fill pads to the right window edge so $status lands
# there — but $status is empty after every successful command, so it was padding
# ~78 spaces to align nothing, on every prompt. That whitespace also got swept
# into any selection. Exit codes now sit inline, next to what you're reading.
#
# Two lines joined by a ╭─ / ╰─ frame: context on top, the command below. No
# OS icon and no prompt glyph — the ╰─ itself is the prompt (see [character]).
# The frame is box-drawing Unicode, so it needs no Nerd Font.
format = """
[╭─](bright-black) $username$hostname$directory$git_branch$git_status$python$nodejs$package$cmd_duration$status
$character"""

# No blank row before each prompt. Starship defaults this to true; it buys
# separation between command blocks in dense scrollback, but costs a row at the
# top of every cleared screen. Top-level keys must appear before the first
# [table] below — put back as `add_newline = true` if the separation is missed.
add_newline = false

# The bottom of the frame doubles as the prompt symbol: dim after success, red
# after a failed command, so the exit state is still visible without a glyph.
# Note that a literal $ here would need escaping ('[\$](bold green)') — bare [$]
# parses as a variable reference, logs a warning, and silently drops the character.
[character]
success_symbol = "[╰─](bright-black)"
error_symbol = "[╰─](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold blue"

# Using colour NAMES rather than hex means the prompt follows the terminal
# theme instead of drifting from it: magenta is Kanagawa's oniViolet.
[git_branch]
symbol = " "
style = "magenta"
format = "[on](bright-black) [$symbol$branch(:$remote_branch)]($style) "

# Count first, then what it is: "2Δ" reads as "two modified". Δ is the standard
# notation for change; the rest of the family uses git's own status letters
# where it has them (? for untracked, R for renamed) so nothing needs decoding.
[git_status]
style = "bright-yellow"
format = "[$all_status$conflicted$ahead_behind]($style) "
modified = "${count}Δ "
staged = "${count}+ "
untracked = "${count}? "
deleted = "${count}− "
renamed = "${count}R "
stashed = "${count}≡ "
conflicted = "${count}! "
ahead = "${count}⇡ "
behind = "${count}⇣ "
diverged = "${ahead_count}⇡${behind_count}⇣ "

[python]
symbol = " "

[nodejs]
symbol = " "

[package]
symbol = " "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

# Off: the distro icon read as noise. The symbol table stays so it can come
# back with `disabled = false` and `$os` in the format.
[os]
disabled = true
style = "bright-black"
