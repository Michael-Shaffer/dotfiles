# Starship prompt configuration
# Shared across bash, zsh, fish on every OS. Lives in the dotfiles repo,
# symlinked to ~/.config/starship.toml
#
# Palette based on Catppuccin Mocha to match the terminal + nvim.

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "

[git_status]
symbol = " "

[python]
symbol = " "

[nodejs]
symbol = " "

[package]
symbol = " "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[os]
disabled = false
style = "bold white"

[username]
show_always = false
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
format = "@[$hostname]($style) "

# Keep the prompt from getting noisy.
[fill]
symbol = " "

[status]
disabled = false
symbol = "✗ "

[time]
disabled = true

[format]
# Minimal, informative, no clutter.
format = "$os$username$hostname$directory$git_branch$git_status$python$nodejs$package$cmd_duration$fill$status$character"
